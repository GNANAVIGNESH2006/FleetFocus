<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FleetFocus</title>
  <script src="js/auth.js"></script>
  <script>
    const token = localStorage.getItem("jwtToken");
    if (token && !isTokenExpired(token)) {
      window.location.href = "dashboard.html";
    } else {
      clearSession();
      window.location.href = "login.html";
    }
  </script>
</head>
<body></body>
</html>
