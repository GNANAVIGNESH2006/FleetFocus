<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register - FleetFocus</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons (CDN) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-truck text-primary" style="font-size: 2.5rem"></i>
        <h3 class="login-brand mt-2 mb-0">FleetFocus</h3>
        <p class="text-muted small">Create a new account</p>
      </div>

      <div id="registerAlert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="regUsername" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="regUsername"
            placeholder="Choose a username"
            autocomplete="username"
            minlength="3"
            maxlength="30"
            required
          />
        </div>
        <div class="mb-3">
          <label for="regEmail" class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            id="regEmail"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="regPassword"
            placeholder="At least 6 characters"
            autocomplete="new-password"
            minlength="6"
            required
          />
        </div>
        <div class="mb-4">
          <label for="regRole" class="form-label">Role</label>
          <select class="form-select" id="regRole" required>
            <option value="DRIVER">Driver</option>
            <option value="DISPATCHER">Dispatcher</option>
            <option value="ADMIN">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-person-plus me-1"></i> Create Account
        </button>
      </form>

      <p class="text-center small text-muted mt-3 mb-0">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>

  <!-- Full-page loading spinner -->
  <div id="loadingSpinner" class="d-none">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Axios (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
