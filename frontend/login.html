<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - FleetFocus</title>

  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">
  <div class="card login-card shadow-lg">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <i class="bi bi-truck text-primary" style="font-size: 2.5rem" aria-hidden="true"></i>
        <h3 class="login-brand mt-2 mb-0">FleetFocus</h3>
        <p class="text-muted small">Fleet Management System</p>
      </div>

      <div id="loginAlert" aria-live="polite"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input
            type="text"
            class="form-control"
            id="username"
            placeholder="Enter your username"
            autocomplete="username"
            maxlength="30"
            required
          />
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            maxlength="72"
            required
          />
        </div>
        <button type="submit" class="btn btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i> Log In
        </button>
      </form>

      <p class="text-center small text-muted mt-3 mb-0">
        Don't have an account? <a href="register.html">Register</a>
      </p>
    </div>
  </div>

  <!-- Full-page loading spinner -->
  <div id="loadingSpinner" class="d-none">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="vendor/axios/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
