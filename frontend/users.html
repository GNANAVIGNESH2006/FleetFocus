<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users - FleetFocus</title>
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/bootstrap-icons/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="d-flex">
  <nav id="sidebar" class="sidebar d-flex flex-column" aria-label="Main navigation">
    <div class="brand"><i class="bi bi-truck me-2"></i>FleetFocus</div>
    <ul class="nav flex-column py-2">
      <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
      <li class="nav-item" data-roles="ADMIN,DISPATCHER"><a class="nav-link" href="vehicles.html"><i class="bi bi-car-front"></i>Vehicles</a></li>
      <li class="nav-item" data-roles="ADMIN,DISPATCHER"><a class="nav-link" href="drivers.html"><i class="bi bi-person-badge"></i>Drivers</a></li>
      <li class="nav-item" data-roles="ADMIN,DISPATCHER"><a class="nav-link" href="trips.html"><i class="bi bi-sign-turn-right"></i>Trips</a></li>
      <li class="nav-item" data-roles="ADMIN,DISPATCHER"><a class="nav-link" href="maintenance.html"><i class="bi bi-tools"></i>Maintenance</a></li>
      <li class="nav-item" data-roles="ADMIN"><a class="nav-link active" href="users.html"><i class="bi bi-people"></i>Users</a></li>
    </ul>
  </nav>
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
  <div class="flex-grow-1 d-flex flex-column">
    <nav class="navbar topbar px-3">
      <button id="sidebarToggleBtn" class="btn btn-outline-secondary d-lg-none me-2" aria-label="Toggle navigation"><i class="bi bi-list"></i></button>
      <span class="navbar-brand mb-0 h5 d-none d-sm-inline">User Management</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span id="navUserLabel" class="text-muted small"></span>
        <a href="#" id="logoutBtn" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
      </div>
    </nav>
    <main class="main-content">
      <div id="usersAlert" aria-live="polite"></div>
      <div class="card content-card">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h5 class="mb-0"><i class="bi bi-people me-1"></i>System Users</h5>
            <button id="addUserBtn" class="btn btn-primary btn-sm"><i class="bi bi-person-plus me-1"></i>Add User</button>
          </div>
          <div class="row g-2 mb-3">
            <div class="col-12 col-md-5">
              <input type="search" id="userSearch" class="form-control form-control-sm" placeholder="Search by username or email..." aria-label="Search users" />
            </div>
            <div class="col-6 col-md-4">
              <select id="userRoleFilter" class="form-select form-select-sm" aria-label="Filter by role">
                <option value="">All Roles</option>
                <option value="ADMIN">ADMIN</option>
                <option value="DISPATCHER">DISPATCHER</option>
                <option value="DRIVER">DRIVER</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <select id="userSort" class="form-select form-select-sm" aria-label="Sort users">
                <option value="id,asc">Sort: ID (Asc)</option>
                <option value="id,desc">Sort: ID (Desc)</option>
                <option value="username,asc">Sort: Username (A-Z)</option>
                <option value="role,asc">Sort: Role (A-Z)</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th class="text-end">Action</th></tr></thead>
              <tbody id="usersTableBody"><tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr></tbody>
            </table>
          </div>
          <div id="usersPagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal fade" id="createUserModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <form id="createUserForm">
      <div class="modal-header">
        <h5 class="modal-title">Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="createUserFormAlert" aria-live="polite"></div>
        <div class="mb-3">
          <label for="newUsername" class="form-label">Username</label>
          <input type="text" class="form-control" id="newUsername" minlength="3" maxlength="30" pattern="^[A-Za-z0-9._-]{3,30}$" title="3-30 characters: letters, digits, dots, underscores, or hyphens" required />
        </div>
        <div class="mb-3">
          <label for="newEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="newEmail" maxlength="100" required />
        </div>
        <div class="mb-3">
          <label for="newPassword" class="form-label">Password</label>
          <input type="password" class="form-control" id="newPassword" minlength="8" maxlength="72" required />
        </div>
        <div class="mb-1">
          <label for="createUserRole" class="form-label">Role</label>
          <select class="form-select" id="createUserRole" required>
            <option value="DRIVER">DRIVER</option>
            <option value="DISPATCHER">DISPATCHER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Create User</button>
      </div>
    </form>
  </div></div>
</div>

<div class="modal fade" id="roleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <form id="roleForm">
      <div class="modal-header">
        <h5 class="modal-title">Update Role</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="roleFormAlert" aria-live="polite"></div>
        <input type="hidden" id="roleUserId" />
        <label for="newRole" class="form-label">Role</label>
        <select class="form-select" id="newRole" required>
          <option value="ADMIN">ADMIN</option>
          <option value="DISPATCHER">DISPATCHER</option>
          <option value="DRIVER">DRIVER</option>
        </select>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
    </form>
  </div></div>
</div>

<div class="modal fade" id="userDeleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title"><i class="bi bi-exclamation-triangle text-danger me-1"></i>Confirm Delete</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
    <div class="modal-body">Are you sure you want to delete this user? This action cannot be undone.</div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" id="confirmUserDeleteBtn" class="btn btn-danger">Delete</button>
    </div>
  </div></div>
</div>

<div id="loadingSpinner" class="d-none">
  <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading...</span></div>
</div>
<script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="vendor/axios/axios.min.js"></script>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/users.js"></script>
</body>
</html>
