# ===================================================================
# FleetFocus Backend - Example Application Properties
# Copy or set the corresponding environment variables before running.
# ===================================================================

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fleetfocus_dbs?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.open-in-view=false

# JWT Configuration (Base64-encoded key >= 256 bits)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:63342}

# Trip Overdue Threshold (hours)
app.trip.overdue-hours=${TRIP_OVERDUE_HOURS:8}

# Development DataSeeder Passwords (only used when --spring.profiles.active=dev)
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.dispatcher-password=${SEED_DISPATCHER_PASSWORD:}
app.seed.driver-password=${SEED_DRIVER_PASSWORD:}
