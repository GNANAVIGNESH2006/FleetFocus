# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== MySQL Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fleetfocus_dbs?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.validation.mode=none
spring.jpa.open-in-view=false

# ===== JWT =====
# Base64-encoded secret (minimum 256 bits / 32 decoded bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# ===== CORS & Application =====
app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:63342}
app.trip.overdue-hours=${TRIP_OVERDUE_HOURS:8}

# ===== Dev Seeder (used only when spring.profiles.active=dev) =====
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.dispatcher-password=${SEED_DISPATCHER_PASSWORD:}
app.seed.driver-password=${SEED_DRIVER_PASSWORD:}
